name: Deploy demo store

# Push to main only, and never `pull_request` or `pull_request_target`.
#
# That is the load-bearing line in this file. The repository is public, so
# anyone can open a pull request, and a workflow that runs on one runs code the
# author controls. `pull_request` from a fork is not given the repository's
# secrets, which is the safe half; `pull_request_target` is given them while
# checking out the fork's code, which is the well-known way to hand a
# Cloudflare token to a stranger. Neither is needed to deploy a demo, so
# neither is here.
on:
  push:
    branches: [main]
    paths:
      - 'apps/next-store/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# Nothing here writes to the repository. The default token is read-only so that
# a compromised dependency in the build cannot push a commit or a release.
permissions:
  contents: read

# One deploy at a time. Two pushes in quick succession would otherwise race to
# upload, and the Worker that wins is whichever finished last rather than
# whichever was newer.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    # Point this at a GitHub Environment to require a manual approval before
    # the secrets are handed over. Worth doing once the demo is real.
    environment: demo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` from the workspace root. The store depends on honeystick,
      # @honeystick/next and @honeystick/react at "*", which npm resolves to the
      # local packages - installing inside apps/next-store instead would send it
      # looking for those on the registry, where they are not.
      - name: Install
        run: npm ci

      # The SDK packages export TypeScript source rather than build output, so
      # Next transpiles them and there is nothing to compile first. This runs
      # anyway, as a typecheck: a deploy is a bad moment to discover the store
      # and the SDK disagree about a type.
      - name: Typecheck packages
        run: npx tsc --build

      # Two steps, because `opennextjs-cloudflare deploy` deploys a *built* app
      # and does not build one. Running only the deploy fails with "Could not
      # find compiled Open Next config", which reads like a configuration
      # problem and is actually a missing step.
      #
      # Separate rather than chained so the logs distinguish the two failures
      # that matter: a build that broke (your code) from an upload that was
      # refused (the token, the route, the account).
      - name: Build the Worker
        run: npm run cf:build --workspace @honeystick/next-store

      # Two Workers, one bundle.
      #
      # They can share a build because the only thing that differs between them
      # is `NEXT_PUBLIC_STORE_URL`, and that is read in `'use server'` files -
      # so it resolves from the Worker's `vars` at request time rather than
      # being inlined by `next build`. A value used in a client component could
      # not be done this way and would need a build each.
      #
      # HONEYSTICK_SECRET_KEY is deliberately absent from both. Each Worker gets
      # its own with `wrangler secret put --env ...`, set once and surviving
      # every deploy - so this job never holds a billing credential, and a
      # leaked CLOUDFLARE_API_TOKEN costs a redeploy rather than an
      # organization's data.
      - name: Deploy dev-demo.honeystick.co.za
        run: npm run cf:deploy:dev --workspace @honeystick/next-store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Production last, so a deploy that is going to fail has already failed on
      # dev - which is the only ordering that makes deploying both from one push
      # better than deploying one.
      - name: Deploy demo.honeystick.co.za
        run: npm run cf:deploy --workspace @honeystick/next-store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
